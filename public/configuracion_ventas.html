<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartPOS | Configuración de Ventas</title>

  <!-- 🎨 Librerías -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

  <!-- 💅 Estilos -->
  <link rel="stylesheet" href="/css/configuracion_ventas.css">
  <link rel="icon" href="/img/favicon-pos.png">
</head>

<body class="min-h-screen flex flex-col font-inter text-gray-900">

  <!-- ==========================================================
       💎 Encabezado fijo
  ========================================================== -->
  <header class="header-config">
    <div class="header-content">
      <button onclick="window.location.href='/configuracion.html'" class="btn-volver">
        <i data-lucide="arrow-left"></i> Volver
      </button>

      <div class="flex items-center gap-2 ml-auto">
        <i data-lucide="shopping-cart" class="w-6 h-6 text-white"></i>
        <h1 class="text-xl font-semibold text-white">
          Configuración de Ventas
        </h1>
      </div>
    </div>
  </header>

  <!-- ==========================================================
       🛒 Contenido principal
  ========================================================== -->
  <main id="contenedor-ventas"
        class="flex-1 max-w-3xl mx-auto p-6 mt-[6rem] mb-10">

    <div class="bg-white/90 backdrop-blur-md rounded-2xl border
                border-fuchsia-200 shadow-lg p-10 animate-fadeIn">

      <!-- 🔄 Loader -->
      <div id="loaderVentas"
           class="flex flex-col items-center justify-center space-y-4 py-10">
        <div class="relative">
          <div class="w-12 h-12 rounded-full border-4
                      border-fuchsia-300 border-t-fuchsia-700 animate-spin"></div>
          <i data-lucide="settings"
             class="w-6 h-6 absolute inset-0 m-auto
                    text-fuchsia-700 animate-pulse"></i>
        </div>

        <p class="text-fuchsia-700 font-semibold">
          Cargando configuraciones de ventas...
        </p>
        <p class="text-gray-500 text-sm">
          Por favor, espera un momento.
        </p>
      </div>

      <!-- 🔹 Contenido dinámico -->
      <div id="contenidoVentas" class="hidden"></div>
    </div>
  </main>

  <!-- ==========================================================
       🧩 Scripts (SOLO LOS NECESARIOS)
  ========================================================== -->
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>

  <!-- ⚠️ NO cargar index.js NI configNegocio.js aquí -->
  <script type="module" src="/js/localdb.js"></script>
  <script type="module" src="/js/configuracion/ventas_config.js"></script>

  <!-- ==========================================================
       ✨ UI helpers
  ========================================================== -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();
    });

    // Loader seguro (NO rompe si el DOM cambia)
    window.addEventListener("load", () => {
      setTimeout(() => {
        const loader = document.getElementById("loaderVentas");
        const contenido = document.getElementById("contenidoVentas");

        if (loader) loader.classList.add("hidden");
        if (contenido) contenido.classList.remove("hidden");
      }, 800);
    });
  </script>

  <!-- 🎨 Animaciones -->
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.6s ease-out forwards;
    }
  </style>

</body>
</html>
