<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartPOS | Productos No Vendidos</title>

  <!-- Librerías -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body{
      background:#1A042D;
      color:white;
      font-family: Inter, system-ui;
    }

    .header{
      background:linear-gradient(90deg,#7c3aed,#ec4899);
      padding:14px 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:fixed;
      width:100%;
      top:0;
      left:0;
      z-index:10;
    }

    .card{
      background:white;
      border-radius:10px;
      padding:20px;
      color:#111;
      box-shadow:0 10px 25px rgba(0,0,0,0.15);
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:14px;
    }

    thead{
      background:linear-gradient(90deg,#7c3aed,#ec4899);
      color:white;
    }

    th{
      padding:12px 16px;
      text-align:left;
      font-weight:600;
    }

    td{
      padding:14px 16px;
      border-bottom:1px solid #eee;
    }

    tbody tr:hover{
      background:#fafafa;
    }

  </style>

</head>

<body>

<header class="header">
  <div class="flex items-center gap-2">
    <i data-lucide="package-search"></i>
    <span class="font-bold">Productos No Vendidos</span>
  </div>

  <button onclick="location.href='/venta.html'" class="bg-white/20 px-3 py-1 rounded">
    Volver
  </button>
</header>


<main class="mt-[80px] px-6 space-y-6">


<!-- PANEL RESUMEN -->
<div class="grid md:grid-cols-3 gap-4">

  <div class="card">
    <div class="text-xs text-gray-500">Inventario detenido</div>
    <div id="totalInventario" class="text-xl font-bold">$0</div>
  </div>

  <div class="card">
    <div class="text-xs text-gray-500">Productos +30 días</div>
    <div id="prod30" class="text-xl font-bold">0</div>
  </div>

  <div class="card">
    <div class="text-xs text-gray-500">Productos +60 días</div>
    <div id="prod60" class="text-xl font-bold">0</div>
  </div>

</div>


<!-- BUSCADOR -->
<div class="card">

  <input
    id="buscar"
    placeholder="Buscar por SKU o nombre..."
    class="w-full border p-2 rounded"
  >

</div>


<!-- TABLA -->
<div class="card overflow-x-auto">

<table>

<thead>
<tr>

<th>SKU</th>
<th>Producto</th>
<th>Categoría</th>
<th class="text-right">Costo</th>
<th class="text-right">Precio</th>
<th class="text-right">Existencias</th>
<th class="text-right">Valor Inventario</th>
<th class="text-right">Días sin vender</th>
<th class="text-center">Acción</th>

</tr>
</thead>

<tbody id="tablaProductos"></tbody>

</table>

</div>

</main>


<script type="module" src="/js/reportes/productosNoVendidos.js"></script>
<script>lucide.createIcons()</script>

</body>
</html>
