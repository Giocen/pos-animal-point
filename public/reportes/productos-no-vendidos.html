<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartPOS | Productos No Vendidos</title>

  <!-- 🎨 Librerías -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 📄 Estilos -->
  <link rel="stylesheet" href="/css/reportes.css">
</head>

<body>

<!-- ----------------------------------------------------------
  💜 HEADER ESTILO REPORTES
----------------------------------------------------------- -->
<header class="header-reportes">
  <div class="header-content">

    <button onclick="window.location.href='/venta.html'" class="btn-volver">
      <i data-lucide="arrow-left"></i> Volver a ventas
    </button>

    <div class="flex items-center gap-2">
      <i data-lucide="package-search" class="w-6 h-6 text-white"></i>
      <h1 class="text-xl font-bold text-white">Productos No Vendidos</h1>
    </div>

  </div>
</header>


<!-- ----------------------------------------------------------
  📦 CONTENIDO PRINCIPAL
----------------------------------------------------------- -->
<main class="mt-[5.5rem] px-6">

  <!-- 🔍 Filtros -->
  <section id="filtros" class="fadeIn">
    <div id="filtroContenedor" class="flex flex-wrap items-end gap-4">

      <div class="flex flex-col flex-1 min-w-[240px]">
        <label class="text-sm font-semibold text-fuchsia-700 mb-1">
          Buscar por SKU o Nombre
        </label>
        <input id="buscar" class="input-filtro" placeholder="Ej. 12345 / Shampoo perro">
      </div>

    </div>
  </section>


  <!-- ----------------------------------------------------------
    📄 TABLA PRODUCTOS NO VENDIDOS
  ----------------------------------------------------------- -->
  <section id="resultado" class="mt-4">

    <div class="contenedor-pnv">

      <table class="tabla-pnv">
        <thead>
          <tr>
            <th>SKU</th>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Costo</th>
            <th>Precio</th>
            <th>Existencias</th>
          </tr>
        </thead>

        <tbody id="tablaProductos"></tbody>
      </table>

    </div>

  </section>

</main>


<!-- ----------------------------------------------------------
  📌 JAVASCRIPT
----------------------------------------------------------- -->
<script type="module">

  import { supabaseClient, protegerSesion } from "/js/proteccion.js";
  await protegerSesion(["admin"]);

  const tabla = document.getElementById("tablaProductos");
  const inputBuscar = document.getElementById("buscar");

  let listaOriginal = [];

  // ==========================================================
  // 🔄 Cargar productos no vendidos
  // ==========================================================
  async function cargarProductos() {

    const { data, error } = await supabaseClient
      .from("v_productos_no_vendidos")
      .select("*")
      .order("nombre");

    if (error) {
      console.error(error);
      Swal.fire("Error", "No se pudieron cargar los datos", "error");
      return;
    }

    listaOriginal = data;
    renderTabla(data);
  }


  // ==========================================================
  // 🧱 Render tabla
  // ==========================================================
  function renderTabla(lista) {
    tabla.innerHTML = "";

    if (lista.length === 0) {
      tabla.innerHTML = `
        <tr>
          <td colspan="6" class="py-3 text-center text-gray-400">
            No hay productos sin ventas
          </td>
        </tr>`;
      return;
    }

    lista.forEach(p => {

      tabla.insertAdjacentHTML("beforeend", `
        <tr>
          <td>${p.sku}</td>
          <td>${p.nombre}</td>
          <td>${p.categoria}</td>
          <td>$${p.costo.toFixed(2)}</td>
          <td>$${p.precio_base.toFixed(2)}</td>
          <td>${p.existencias}</td>
        </tr>
      `);

    });
  }


  // ==========================================================
  // 🔍 Buscador
  // ==========================================================
  inputBuscar.addEventListener("input", () => {
    const q = inputBuscar.value.toLowerCase();

    const filtrados = listaOriginal.filter(p =>
      p.nombre.toLowerCase().includes(q) ||
      p.sku.toLowerCase().includes(q) ||
      p.categoria.toLowerCase().includes(q)
    );

    renderTabla(filtrados);
  });

  cargarProductos();

</script>

<script> lucide.createIcons(); </script>

</body>
</html>
