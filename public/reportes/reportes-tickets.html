<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartPOS | Reporte de Tickets</title>

  <!-- 🎨 Librerías base -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 💅 Estilos SmartPOS Reportes -->
  <link rel="stylesheet" href="/css/reportes.css" />

  <link rel="icon" type="image/png" href="/img/favicon-pos.png" />
</head>

<body>

<!-- ==========================================================
     💜 HEADER ESTILO REPORTES
========================================================== -->
<header class="header-reportes">
  <div class="header-content">

    <button onclick="window.location.href='/venta.html'" class="btn-volver">
      <i data-lucide="arrow-left"></i> Volver a ventas
    </button>

    <div class="flex items-center gap-2">
      <i data-lucide="receipt" class="w-6 h-6 text-white"></i>
      <h1 class="text-xl font-bold text-white">Reporte de Tickets</h1>
    </div>

  </div>
</header>


<!-- ==========================================================
     📄 CONTENIDO PRINCIPAL
========================================================== -->
<main class="mt-[5.5rem] px-6">

  <!-- 🔍 FILTRO -->
  <section id="filtros" class="fadeIn mb-4">

    <div id="filtroContenedor">

      <div class="flex flex-col flex-1 min-w-[200px]">
        <label class="text-sm font-semibold text-fuchsia-700 mb-1">Desde</label>
        <input id="fechaInicio" type="date" class="input-filtro">
      </div>

      <div class="flex flex-col flex-1 min-w-[200px]">
        <label class="text-sm font-semibold text-fuchsia-700 mb-1">Hasta</label>
        <input id="fechaFin" type="date" class="input-filtro">
      </div>

      <button id="btnBuscarTickets"
        class="bg-gradient-to-r from-fuchsia-600 to-purple-600 text-white 
               font-semibold px-4 py-2 rounded-md flex items-center gap-2 
               hover:opacity-90 transition">
        <i data-lucide="search" class="w-4 h-4"></i> Buscar
      </button>

    </div>
  </section>


  <!-- ==========================================================
       🧾 LISTA DE TICKETS
  =========================================================== -->
  <section id="resultado">

    <table>
      <thead>
        <tr>
          <th>ID Venta</th>
          <th>Fecha</th>
          <th>Total</th>
          <th>Productos</th>
          <th>PDF</th>
          <th>Térmico</th>
        </tr>
      </thead>

      <tbody id="listaTickets"></tbody>
    </table>

  </section>

</main>


<!-- ==========================================================
     📌 Scripts
========================================================== -->
<script type="module" src="/js/reportes/reporte-tickets.js"></script>
<script> lucide.createIcons(); </script>

</body>
</html>
