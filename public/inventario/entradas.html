<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartPOS | Entradas de Inventario</title>

  <!-- 🎨 Librerías base -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- 💅 Estilos -->
  <link rel="stylesheet" href="../css/entradas.css">
  <link rel="icon" href="/img/favicon-pos.png">
</head>

<body class="index-body flex flex-col min-h-screen select-none">

  <!-- 🧭 Encabezado -->
  <header class="header-entradas">
    <div class="header-content">
      <button onclick="window.location.href='/venta.html'" class="btn-volver">
        <i data-lucide="arrow-left"></i> Volver
      </button>

      <div class="titulo-header">
        <i data-lucide="package-plus"></i>
        <h1>Entradas de Inventario</h1>
      </div>
    </div>
  </header>

  <!-- 📦 Contenido -->
  <main>
    <div class="form-entradas">
      
      <!-- 🧾 Producto detectado -->
      <section id="infoProducto" class="hidden bg-white/90 border border-fuchsia-200 rounded-lg shadow-sm p-4 flex justify-between items-center text-sm font-medium">
        <span id="nombreProducto" class="text-fuchsia-700 font-semibold truncate">—</span>
        <span id="stockActual" class="text-gray-700">Existencias: 0</span>
      </section>

      <!-- 📋 Formulario -->
      <form id="formEntrada" class="space-y-5 mt-4">
        
        <!-- Código -->
        <label class="block flex flex-col gap-1">
          <span class="label"><i data-lucide="barcode" class="w-4 h-4"></i> Código de barras o SKU</span>
          <div class="flex gap-2">
            <input type="text" id="codigoBarras" class="input flex-1" placeholder="Escanea o escribe código" autofocus required>
            <button id="btnCamara" type="button"
              class="bg-gradient-to-r from-fuchsia-600 to-purple-600 text-white px-3 py-2 rounded-md flex items-center justify-center hover:opacity-90">
              <i data-lucide="camera"></i>
            </button>
          </div>
        </label>

        <!-- Cantidad -->
        <label class="block flex flex-col gap-1">
          <span class="label"><i data-lucide="package-plus" class="w-4 h-4"></i> Cantidad recibida</span>
          <input type="number" id="cantidad" class="input" min="0.01" step="0.01" value="1" required>
        </label>

        <!-- Unidad -->
        <label class="block flex flex-col gap-1">
          <span class="label"><i data-lucide="scale" class="w-4 h-4"></i> Tipo de unidad</span>
          <select id="unidadCaptura" class="input">
            <option value="pieza">Pieza</option>
            <option value="kg">Kg</option>
          </select>
        </label>

        <!-- Fecha Caducidad -->
        <label id="boxCaducidad" class="block flex flex-col gap-1 hidden">
          <span class="label"><i data-lucide="calendar" class="w-4 h-4"></i> Fecha de caducidad</span>
          <input type="date" id="fechaCaducidad" class="input">
        </label>

        <!-- Modo -->
        <label class="block flex flex-col gap-1">
          <span class="label"><i data-lucide="zap" class="w-4 h-4"></i> Modo de escaneo</span>
          <select id="modoCaptura" class="input">
            <option value="manual">Manual</option>
            <option value="rapido">Escaneo rápido</option>
          </select>
        </label>

        <!-- Guardar -->
        <button id="btnGuardar" type="submit"
          class="bg-gradient-to-r from-fuchsia-600 to-purple-600 text-white w-full py-2 rounded-md font-semibold flex items-center justify-center gap-2 hover:opacity-90">
          <i data-lucide="save"></i> Guardar Entrada
        </button>
      </form>

      <!-- 🧾 Historial -->
      <section id="historialEntradas" class="hidden border border-fuchsia-100 rounded-lg shadow-sm p-5 space-y-4 mt-6 bg-white/90">
        <h2 class="text-lg font-semibold text-fuchsia-700 flex items-center gap-2">
          <i data-lucide="list"></i> Historial de Entradas
        </h2>

        <div class="overflow-x-auto">
          <table class="w-full text-sm border-collapse">
            <thead class="bg-fuchsia-50">
              <tr>
                <th class="px-3 py-2 text-left">Producto</th>
                <th class="px-3 py-2 text-center">Cantidad</th>
                <th class="px-3 py-2 text-center">Unidad</th>
                <th class="px-3 py-2 text-center">Caducidad</th>
                <th class="px-3 py-2 text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaHistorial"></tbody>
          </table>
        </div>

        <div class="flex justify-between mt-4">
          <button id="btnRegistrarTodo"
            class="bg-gradient-to-r from-emerald-600 to-teal-500 text-white px-4 py-2 rounded-md flex items-center gap-2 hover:opacity-90">
            <i data-lucide="check-circle"></i> Registrar todo
          </button>

          <button id="btnExportarPDF"
            class="bg-gradient-to-r from-indigo-600 to-blue-600 text-white px-4 py-2 rounded-md flex items-center gap-2 hover:opacity-90">
            <i data-lucide="file-text"></i> Exportar PDF
          </button>
        </div>
      </section>
    </div>
  </main>

  <!-- ⚙️ Scripts -->
  <script type="module" src="../js/localdb.js"></script>  
  <script type="module" src="../js/proteccion.js"></script>
  <script type="module" src="../js/inventario/entradas.js"></script>

  <script>document.addEventListener("DOMContentLoaded", () => lucide.createIcons());</script>

</body>
</html>
