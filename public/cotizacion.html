<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SmartPOS | Cotización</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

</head>

<body class="bg-gradient-to-br from-purple-800 via-fuchsia-700 to-purple-900 min-h-screen font-sans">

<div class="w-full min-h-screen flex flex-col">

  <!-- 🔥 HEADER PRO -->
  <header class="bg-gradient-to-r from-fuchsia-700 to-purple-800 text-white shadow-lg">

    <div class="flex justify-between items-center px-6 py-3">

      <div class="flex items-center gap-4">

        <button onclick="window.location.href='/venta'"
          class="bg-white/20 hover:bg-white/30 px-3 py-1 rounded flex items-center gap-2">
          <i data-lucide="arrow-left"></i>
          Ventas
        </button>

        <h1 class="text-xl font-bold flex items-center gap-2">
          <i data-lucide="file-text"></i>
          Cotización
        </h1>

        <button onclick="window.location.href='/cotizaciones'"
          class="bg-indigo-600 hover:bg-indigo-700 px-3 py-1 rounded flex items-center gap-2 text-sm shadow">
          <i data-lucide="clipboard-list"></i>
          Ver cotizaciones
        </button>

      </div>

      <select id="modoCotizacion"
        class="bg-white text-gray-800 px-3 py-2 rounded shadow text-sm outline-none">
        <option value="costo">Modo Usuario (Costo)</option>
        <option value="precio">Modo Cliente (Precio)</option>
      </select>

    </div>

  </header>

  <!-- CONTENIDO -->
  <main class="flex-1 p-4">

    <div class="w-full h-full bg-white rounded-xl shadow-lg p-4 flex flex-col gap-4">

      <!-- INFO NEGOCIO -->
      <div id="infoNegocio"
        class="bg-gray-50 border rounded-lg p-3 text-sm flex items-center gap-3">

        <img id="logoNegocio"
          class="w-12 h-12 object-contain rounded hidden">

        <div>
          <div id="nombreNegocio" class="font-bold text-base"></div>
          <div id="direccionNegocio" class="text-gray-500"></div>
          <div id="telefonoNegocio" class="text-gray-500"></div>
        </div>

      </div>

      <!-- CLIENTE -->
      <div class="grid grid-cols-2 gap-3">

        <input id="clienteNombre"
          placeholder="Nombre del cliente"
          class="border p-2 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">

        <input id="clienteTelefono"
          placeholder="Teléfono"
          class="border p-2 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">

      </div>

      <!-- BUSCADOR -->
      <div class="relative">

        <i data-lucide="search"
          class="absolute left-3 top-3 w-4 h-4 text-gray-400"></i>

        <input
          id="buscarProducto"
          type="text"
          placeholder="Buscar producto..."
          class="w-full pl-10 p-3 rounded-lg border shadow-sm focus:ring-2 focus:ring-purple-500 outline-none"
        >

        <div id="resultados"
          class="absolute left-0 right-0 top-full mt-1 bg-white border rounded shadow-lg max-h-96 overflow-auto z-50 hidden">
        </div>

      </div>

      <!-- TABLA -->
      <div class="flex-1 overflow-auto border rounded-lg">

        <table class="w-full text-sm">

          <thead class="bg-purple-100 text-purple-800 sticky top-0">
            <tr>
              <th class="text-left px-3 py-2">Producto</th>
              <th class="text-center px-3 w-24">Cantidad</th>
              <th class="text-right px-3 w-28">Precio</th>
              <th class="text-right px-3 w-28">Total</th>

              <!-- 🔥 NUEVO -->
              <th class="text-right px-3 w-28 text-green-700">Ganancia</th>
              <th class="text-right px-3 w-24 text-blue-700">Margen</th>

              <th class="w-12"></th>
            </tr>
          </thead>

          <tbody id="tablaCotizacion" class="divide-y"></tbody>

        </table>

      </div>

      <!-- TOTAL -->
      <div class="text-right text-2xl font-bold text-purple-700 border-t pt-3">
        Total: $<span id="total">0.00</span>
      </div>

      <!-- BOTONES PRO -->
      <div class="flex justify-end gap-2 flex-wrap">

        <button onclick="guardarCotizacion()"
          class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2">
          <i data-lucide="save"></i>
          Guardar
        </button>

        <button onclick="imprimirCotizacion()"
          class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2">
          <i data-lucide="printer"></i>
          Imprimir
        </button>

        <button onclick="descargarPDF()" id="btnPDF"
          class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2">
          <i data-lucide="file-text"></i>
          PDF
        </button>

        <button onclick="compartirWhatsApp()"
          class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2">
          <i data-lucide="send"></i>
          WhatsApp
        </button>

        <button onclick="limpiarCotizacion()"
          class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2">
          <i data-lucide="trash-2"></i>
          Limpiar
        </button>

      </div>

    </div>

  </main>

</div>

<!-- ICONOS -->
<script>
  lucide.createIcons();
</script>


<div id="loaderPDF" 
  class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">

  <div class="bg-white rounded-xl p-6 shadow-lg text-center">

    <div class="animate-spin rounded-full h-10 w-10 border-4 border-purple-500 border-t-transparent mx-auto mb-3"></div>

    <div id="textoLoader" class="font-semibold text-gray-700">
      Generando PDF...
    </div>

  </div>

</div>

<script type="module" src="/js/cotizacion.js"></script>

</body>
</html>
