<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suspender Usuario | SmartPOS</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/admin/admin.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body { 
      background: linear-gradient(135deg,#1A042D,#4b005f); 
      font-family: "Inter"; 
      color: white;
    }
    .card { 
      background: rgba(255,255,255,0.12); 
      padding:24px; 
      border-radius:16px; 
      backdrop-filter:blur(12px); 
      border: 1px solid rgba(255,255,255,0.25);
    }
    input { 
      background: rgba(255,255,255,0.20); 
      border:1px solid rgba(255,255,255,0.30); 
      color:white; 
    }
  </style>

</head>

<body class="min-h-screen flex items-center justify-center">

  <div class="card max-w-md w-full text-center">

    <h1 class="text-xl font-bold mb-4">Suspender Usuario</h1>

    <input id="id" 
      class="w-full px-3 py-2 mb-4 rounded" 
      placeholder="ID del usuario (UUID)">

    <button id="btnSuspender"
      class="w-full py-2 bg-red-600 rounded text-white hover:bg-red-700">
      Suspender Usuario
    </button>

  </div>


  <!-- ========================================================= -->
  <!-- 🟣 SCRIPT FINAL usando supabase-admin.js -->
  <!-- ========================================================= -->
  <script type="module">
    import { supabaseAdmin as supabase } from "/admin/supabase-admin.js";

    /* ============================
       🔍 Validar si es UUID válido
    ============================= */
    function esUUID(str) {
      return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(str);
    }

    /* ======================================================
       🟥 Suspender usuario (AUTH + Tabla interna)
    ====================================================== */
    async function suspender() {
      const id = document.getElementById("id").value.trim();

      if (!id) {
        return Swal.fire("Falta ID", "Ingresa el ID del usuario", "warning");
      }

      if (!esUUID(id)) {
        return Swal.fire("ID inválido", "El ID debe ser un UUID válido.", "error");
      }

      const confirmar = await Swal.fire({
        title: "¿Suspender usuario?",
        text: "El usuario no podrá iniciar sesión.",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Sí, suspender",
        cancelButtonText: "Cancelar",
        confirmButtonColor: "#dc2626"
      });

      if (!confirmar.isConfirmed) return;

      Swal.fire({ title: "Aplicando cambios...", didOpen: () => Swal.showLoading() });

      /* -------------------------------------------------------
         1️⃣ Suspender en AUTH
      ------------------------------------------------------- */
      const { error: err1 } = await supabase.auth.admin.updateUserById(id, { banned: true });

      if (err1) {
        Swal.close();
        return Swal.fire("Error en AUTH", err1.message, "error");
      }

      /* -------------------------------------------------------
         2️⃣ Suspender en tabla interna
      ------------------------------------------------------- */
      const { error: err2 } = await supabase
        .from("usuarios_negocios")
        .update({ activo: false })
        .eq("usuario_id", id);

      if (err2) {
        Swal.close();
        return Swal.fire("Error interno", err2.message, "error");
      }

      Swal.close();
      Swal.fire({
        icon: "success",
        title: "Usuario suspendido",
        text: "El usuario ya no podrá iniciar sesión."
      });
    }

    document.getElementById("btnSuspender").addEventListener("click", suspender);
  </script>

</body>
</html>
