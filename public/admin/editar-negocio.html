<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar Negocio | SmartPOS</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/admin/admin.js"></script>

  <style>
    body {
      background: linear-gradient(135deg,#1A042D,#4b005f);
      font-family: "Inter";
      color: white;
    }
    .card {
      background: rgba(255,255,255,0.15);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.20);
      backdrop-filter: blur(10px);
    }
    input {
      background: rgba(255,255,255,0.20);
      border: 1px solid rgba(255,255,255,0.30);
      color: white;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

  <div class="card max-w-lg w-full">

    <button onclick="history.back()"
      class="mb-4 text-white/70 hover:text-white flex items-center gap-2">
      <i data-lucide="arrow-left"></i> Regresar
    </button>

    <h1 class="text-white text-2xl font-bold mb-6 text-center">Editar Negocio</h1>

    <input id="nombre" class="w-full px-3 py-2 mb-3 rounded" placeholder="Nombre del negocio">
    <input id="telefono" class="w-full px-3 py-2 mb-3 rounded" placeholder="Teléfono">
    <input id="correo" class="w-full px-3 py-2 mb-3 rounded" placeholder="Correo">
    <input id="direccion" class="w-full px-3 py-2 mb-6 rounded" placeholder="Dirección">

    <button id="btnGuardar"
      class="bg-gradient-to-r from-fuchsia-600 to-pink-500 px-4 py-2 rounded text-white w-full font-semibold">
      Guardar Cambios
    </button>

  </div>

<script type="module">
import { supabaseAdmin as supabase } from "/admin/supabase-admin.js";

const negocioID = new URLSearchParams(location.search).get("id");

if (!negocioID) Swal.fire("Error", "ID no válido", "error");

async function cargarNegocio() {
  const { data, error } = await supabase
    .from("negocios")
    .select("*")
    .eq("id", negocioID)
    .single();

  if (error) return Swal.fire("Error", error.message, "error");

  nombre.value = data.nombre || "";
  telefono.value = data.telefono || "";
  correo.value = data.correo || "";
  direccion.value = data.direccion || "";

  lucide.createIcons();
}

async function guardarCambios() {
  const datos = {
    nombre: nombre.value.trim(),
    telefono: telefono.value.trim(),
    correo: correo.value.trim(),
    direccion: direccion.value.trim(),
  };

  if (!datos.nombre)
    return Swal.fire("Falta Nombre", "El negocio debe tener un nombre", "warning");

  const { error } = await supabase
    .from("negocios")
    .update(datos)
    .eq("id", negocioID);

  if (error) return Swal.fire("Error", error.message, "error");

  Swal.fire("Guardado", "Los cambios se actualizaron correctamente.", "success")
    .then(() => history.back());
}

document.getElementById("btnGuardar").onclick = guardarCambios;

cargarNegocio();
</script>

</body>
</html>
