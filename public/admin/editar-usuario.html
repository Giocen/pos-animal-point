<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar Usuario | SmartPOS</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background: linear-gradient(135deg,#1A042D,#4b005f);
      color: white;
      font-family: "Inter";
    }
    .card {
      background: rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(10px);
    }
    input, select {
      background: rgba(255,255,255,0.20);
      border: 1px solid rgba(255,255,255,0.30);
      color: white;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

  <div class="card w-full max-w-md">

    <button onclick="history.back()" class="mb-4 text-white/70 hover:text-white flex items-center gap-2">
      <i data-lucide="arrow-left"></i> Regresar
    </button>

    <h1 class="text-2xl font-bold text-center mb-6">Editar Usuario</h1>

    <input id="nombre" class="w-full px-3 py-2 mb-3 rounded" placeholder="Nombre del usuario">

    <select id="rol" class="w-full px-3 py-2 mb-4 rounded"></select>

    <button id="btnGuardar"
      class="w-full py-2 rounded bg-gradient-to-r from-fuchsia-600 to-pink-500 text-white font-semibold">
      Guardar Cambios
    </button>

  </div>

  <script type="module">
import { supabaseAdmin as supabase } from "/admin/supabase-admin.js";

const usuarioID = new URLSearchParams(location.search).get("id");
if (!usuarioID) Swal.fire("Error", "ID de usuario inválido", "error");

/* ======================================================
   🟣 Cargar Roles desde la tabla roles
====================================================== */
async function cargarRoles() {
  const { data, error } = await supabase.from("roles").select("*");

  if (error) {
    console.error(error);
    return Swal.fire("Error", "No se pudieron cargar los roles", "error");
  }

  const select = document.getElementById("rol");

  select.innerHTML = data
    .map(r => `<option value="${r.id}">${r.nombre}</option>`)
    .join("");
}

/* ======================================================
   🟣 Cargar datos del usuario
====================================================== */
async function cargarUsuario() {
  const { data, error } = await supabase
    .from("usuarios")
    .select("*")
    .eq("id", usuarioID)
    .single();

  if (error || !data) {
    return Swal.fire("Error", "No se pudo cargar el usuario", "error");
  }

  nombre.value = data.nombre;
  rol.value = data.rol_id;
}

/* ======================================================
   🟣 Guardar Cambios
====================================================== */
async function guardarCambios() {
  const datos = {
    nombre: nombre.value.trim(),
    rol_id: Number(rol.value),
  };

  if (!datos.nombre) {
    return Swal.fire("Falta nombre", "El usuario debe tener nombre", "warning");
  }

  const { error } = await supabase
    .from("usuarios")
    .update(datos)
    .eq("id", usuarioID);

  if (error) return Swal.fire("Error", error.message, "error");

  Swal.fire("Actualizado", "Usuario actualizado correctamente", "success")
    .then(() => history.back());
}

/* ======================================================
   🟣 Inicializar
====================================================== */
await cargarRoles();
await cargarUsuario();

document.getElementById("btnGuardar").onclick = guardarCambios;

lucide.createIcons();
  </script>

</body>
</html>
