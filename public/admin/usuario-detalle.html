<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle del Usuario | SmartPOS</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background: linear-gradient(135deg,#1A042D,#4b005f);
      color: white;
      font-family: "Inter";
    }
    .card {
      background: rgba(255,255,255,0.15);
      border-radius: 14px;
      padding: 24px;
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(10px);
    }
    .btn {
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: .2s;
      color: white;
    }
  </style>
</head>

<body class="min-h-screen p-6">

  <button id="btnVolver"
    class="text-white/70 hover:text-white mb-4 flex items-center gap-2">
    <i data-lucide="arrow-left"></i> Regresar
  </button>

  <h1 class="text-3xl font-bold mb-4">Detalle del Usuario</h1>

  <div id="infoUsuario" class="card mb-6 text-center"></div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

    <button id="btnEditar" class="btn bg-blue-600 hover:bg-blue-500">
      <i data-lucide="user-cog"></i> Editar usuario
    </button>

    <button id="btnPassword" class="btn bg-emerald-600 hover:bg-emerald-500">
      <i data-lucide="lock"></i> Cambiar contraseña
    </button>

    <button id="btnSuspender" class="btn bg-amber-600 hover:bg-amber-500">
      <i data-lucide="pause-circle"></i> Suspender usuario
    </button>

    <button id="btnEliminar" class="btn bg-red-600 hover:bg-red-500">
      <i data-lucide="trash-2"></i> Quitar del negocio
    </button>

    <!-- 🟥 NUEVO: ELIMINAR COMPLETAMENTE -->
    <button id="btnEliminarRoot" class="btn bg-red-800 hover:bg-red-700">
      <i data-lucide="x-circle"></i> Eliminar completamente
    </button>

  </div>

<script type="module">
import { supabaseAdmin as supabase } from "/admin/supabase-admin.js";

const params = new URLSearchParams(location.search);
const usuarioID = params.get("id");
const negocioID = params.get("negocio_id");

document.getElementById("btnVolver").onclick = () =>
  location.href = `/admin/negocio-detalle.html?id=${negocioID}`;

/* ======================================================
   Cargar usuario + rol
====================================================== */
async function cargarUsuario() {
  const { data } = await supabase
    .from("usuarios")
    .select("*")
    .eq("id", usuarioID)
    .single();

  if (!data) return;

  const roles = await supabase.from("roles").select("*");
  const rolNombre = roles.data.find(r => r.id === data.rol_id)?.nombre ?? "Sin rol";

  document.getElementById("infoUsuario").innerHTML = `
    <h2 class="text-2xl font-bold">${data.nombre}</h2>
    <p class="text-white/80">${data.correo}</p>
    <p class="text-sm text-white/60">Rol: ${rolNombre}</p>
    <p class="text-sm text-white/60">${data.activo ? "Activo" : "Suspendido"}</p>
  `;

  lucide.createIcons();
}

cargarUsuario();

/* ======================================================
   Editar usuario
====================================================== */
document.getElementById("btnEditar").onclick = () =>
  location.href = `/admin/editar-usuario.html?id=${usuarioID}&negocio_id=${negocioID}`;

/* ======================================================
   Suspender usuario (AUTH + tabla interna)
====================================================== */
document.getElementById("btnSuspender").onclick = async () => {
  const conf = await Swal.fire({
    title: "¿Suspender usuario?",
    text: "El usuario no podrá iniciar sesión",
    showCancelButton: true,
    confirmButtonColor: "#d97706",
    confirmButtonText: "Suspender"
  });

  if (!conf.isConfirmed) return;

  await supabase.auth.admin.updateUserById(usuarioID, { banned: true });

  await supabase.from("usuarios").update({ activo: false }).eq("id", usuarioID);

  await supabase
    .from("usuarios_negocios")
    .update({ activo: false })
    .eq("usuario_id", usuarioID)
    .eq("negocio_id", negocioID);

  Swal.fire("Suspendido", "El usuario ya no puede iniciar sesión.", "success");

  cargarUsuario();
};

/* ======================================================
   Quitar usuario del negocio
====================================================== */
document.getElementById("btnEliminar").onclick = async () => {
  const x = await Swal.fire({
    title: "¿Quitar usuario del negocio?",
    text: "Esto no elimina al usuario del sistema, solo de este negocio.",
    icon: "warning",
    showCancelButton: true,
    confirmButtonColor: "#dc2626",
    confirmButtonText: "Quitar"
  });

  if (!x.isConfirmed) return;

  await supabase
    .from("usuarios_negocios")
    .delete()
    .eq("usuario_id", usuarioID)
    .eq("negocio_id", negocioID);

  Swal.fire("Eliminado", "Usuario removido del negocio.", "success")
    .then(() => location.href = `/admin/negocio-detalle.html?id=${negocioID}`);
};

/* ======================================================
   🟥 ELIMINAR COMPLETAMENTE (ROOT DELETE)
====================================================== */
document.getElementById("btnEliminarRoot").onclick = async () => {
  const r = await Swal.fire({
    title: "¿Eliminar usuario COMPLETAMENTE?",
    html: `
      Se eliminará de:<br>
      • <b>auth.users</b><br>
      • <b>usuarios</b><br>
      • <b>usuarios_negocios</b><br><br>
      <b>Esta acción es irreversible.</b>
    `,
    icon: "error",
    showCancelButton: true,
    confirmButtonColor: "#991b1b",
    confirmButtonText: "Eliminar definitivamente"
  });

  if (!r.isConfirmed) return;

  Swal.fire({ title: "Eliminando...", didOpen: () => Swal.showLoading() });

  try {
    await supabase.from("usuarios_negocios").delete().eq("usuario_id", usuarioID);
    await supabase.from("usuarios").delete().eq("id", usuarioID);

    const { error: authErr } = await supabase.auth.admin.deleteUser(usuarioID);
    if (authErr) throw authErr;

    Swal.fire("Eliminado", "El usuario fue borrado completamente del sistema.", "success")
      .then(() => location.href = "/admin/usuarios.html");

  } catch (err) {
    Swal.fire("Error", err.message, "error");
  }
};

</script>

</body>
</html>
