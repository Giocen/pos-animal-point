<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SmartPOS | Cotizaciones</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body class="bg-gradient-to-br from-purple-800 via-fuchsia-700 to-purple-900 min-h-screen font-sans">

<div class="w-full min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-gradient-to-r from-fuchsia-700 to-purple-800 text-white shadow-lg">

    <div class="flex justify-between items-center px-6 py-3">

      <div class="flex items-center gap-4">

        <button onclick="window.location.href='/cotizacion'"
          class="bg-white/20 hover:bg-white/30 px-3 py-1 rounded flex items-center gap-2">
          <i data-lucide="arrow-left"></i>
          Nueva cotización
        </button>

        <h1 class="text-xl font-bold flex items-center gap-2">
          <i data-lucide="file-text"></i>
          Cotizaciones
        </h1>

      </div>

      <div class="relative">
        <i data-lucide="search" class="absolute left-2 top-2.5 w-4 h-4 text-gray-500"></i>
        <input
          id="buscarCotizacion"
          placeholder="Buscar cliente o folio..."
          class="pl-8 pr-3 py-2 rounded bg-white text-gray-800 text-sm outline-none w-64"
        >
      </div>

    </div>

  </header>

  <!-- CONTENIDO -->
  <main class="flex-1 p-4">

    <div class="w-full h-full bg-white rounded-xl shadow-lg p-4 flex flex-col">

      <!-- TABLA -->
      <div class="flex-1 overflow-auto border rounded-lg">

        <table class="w-full text-sm">

          <thead class="bg-purple-100 text-purple-800 sticky top-0">
            <tr class="h-12">
              <th class="text-left px-4 w-32">Folio</th>
              <th class="text-left px-4">Cliente</th>
              <th class="text-center px-4 w-28">Tipo</th>
              <th class="text-right px-4 w-32">Total</th>
              <th class="text-right px-4 w-36">Fecha</th>
              <th class="text-center px-4 w-40">Acciones</th>
            </tr>
          </thead>

          <tbody id="tablaCotizaciones" class="divide-y">
    
          </tbody>

        </table>

      </div>

      <!-- FOOTER -->
      <div class="mt-3 flex justify-between items-center text-sm text-gray-500">
        <span class="flex items-center gap-1">
          <i data-lucide="database"></i>
          Cotizaciones guardadas
        </span>

        <span id="totalRegistros"></span>
      </div>

    </div>

  </main>

</div>

<script>
  lucide.createIcons();
</script>

<script type="module" src="/js/cotizaciones.js"></script>

</body>
</html>
