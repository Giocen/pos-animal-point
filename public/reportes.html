<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartPOS | Reportes</title>

  <!-- 🎨 Librerías base -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 💅 Estilos SmartPOS -->
  <link rel="stylesheet" href="css/reportes.css">

  <!-- 💬 Tooltip flotante tipo navegador -->
  <style>
    .tooltip-bubble {
      position: fixed;
      background: #f9fafb;
      color: #111827;
      font-size: 12px;
      font-weight: 400;
      padding: 4px 6px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      white-space: nowrap;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      z-index: 999999;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity .12s ease-out, transform .12s ease-out;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col font-inter text-gray-900">

  <!-- HEADER -->
  <header class="header-reportes">
    <div class="header-content">
      <button onclick="window.location.href='/index.html'" class="btn-volver">
        <i data-lucide="arrow-left"></i> Volver al Menú
      </button>
      <div class="flex items-center gap-2">
        <i data-lucide="bar-chart-3" class="w-6 h-6 text-white"></i>
        <h1 class="text-xl font-bold text-white">Reportes de Ventas</h1>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main id="mainReporte" class="flex-1 w-full px-6 mt-[5.5rem]">

    <!-- 🟣 Botones -->
    <div class="flex flex-wrap gap-3 mb-6 justify-center sm:justify-start">
      <button id="btnProducto" class="reporte-btn bg-blue-600" data-tooltip="Ventas agrupadas por producto.">
        <i data-lucide="package" class="w-4 h-4"></i> Ventas por Producto
      </button>

      <button id="btnCategoria" class="reporte-btn bg-indigo-600" data-tooltip="Ventas agrupadas por categoría.">
        <i data-lucide="layers" class="w-4 h-4"></i> Ventas por Categoría
      </button>

      <button id="btnFecha" class="reporte-btn bg-teal-600" data-tooltip="Ventas dentro de un rango de fechas.">
        <i data-lucide="calendar" class="w-4 h-4"></i> Ventas por Fecha
      </button>

      <button id="btnMargen" class="reporte-btn bg-pink-600" data-tooltip="Margen y utilidad por venta.">
        <i data-lucide="trending-up" class="w-4 h-4"></i> Margen y Utilidad
      </button>

      <!-- 🔘 Filtros manual -->
      <button id="btnToggleFiltros" class="reporte-btn bg-gradient-to-r from-fuchsia-600 to-purple-600"
        data-tooltip="Mostrar/ocultar filtros (solo para Fecha o Margen)">
        <i data-lucide="sliders-horizontal" class="w-4 h-4"></i> Filtros
      </button>
    </div>

    <!-- FILTROS -->
    <section id="filtros" class="hidden">
      <div class="flex flex-wrap items-end gap-4" id="filtroContenedor">
        <div class="flex flex-col flex-1 min-w-[180px]">
          <label for="fechaInicio" class="text-sm font-semibold text-fuchsia-700 mb-1">Desde</label>
          <input id="fechaInicio" type="date" class="input-filtro">
        </div>

        <div class="flex flex-col flex-1 min-w-[180px]">
          <label for="fechaFin" class="text-sm font-semibold text-fuchsia-700 mb-1">Hasta</label>
          <input id="fechaFin" type="date" class="input-filtro">
        </div>

        <div class="flex flex-col flex-1 min-w-[180px]">
          <label for="periodo" class="text-sm font-semibold text-fuchsia-700 mb-1">Periodo</label>
          <select id="periodo" class="input-filtro">
            <option value="">-- Selecciona --</option>
            <option value="semana">Esta semana</option>
            <option value="mes">Este mes</option>
            <option value="30dias">Últimos 30 días</option>
          </select>
        </div>

        <button id="btnAplicarFiltro"
          class="bg-gradient-to-r from-fuchsia-600 to-purple-600 text-white font-semibold px-4 py-2 rounded-md flex items-center gap-2 hover:opacity-90 transition">
          <i data-lucide="filter" class="w-4 h-4"></i> Aplicar
        </button>
      </div>
    </section>

    <!-- RESULTADOS -->
    <section id="resumenFecha" class="mb-6 hidden"></section>
    <section id="resultado"></section>

  </main>

  <!-- SCRIPTS -->
  <script type="module" src="js/localdb.js"></script>
  <script type="module" src="js/proteccion.js"></script>
  <script type="module" src="js/reportes.js"></script>

  <script>
document.addEventListener("DOMContentLoaded", () => {
  lucide.createIcons();

  /* ==========================================================
     💬 TOOLTIP flotante (tipo navegador, posición automática)
  ========================================================== */
  const tooltip = document.createElement("div");
  tooltip.className = "tooltip-bubble";
  document.body.appendChild(tooltip);

  document.querySelectorAll("[data-tooltip]").forEach(el => {
    el.addEventListener("mouseenter", e => {
      tooltip.textContent = el.getAttribute("data-tooltip");
      tooltip.style.opacity = "1";
      tooltip.style.transform = "scale(1)";
      const rect = el.getBoundingClientRect();
      const pad = 8;
      const tW = tooltip.offsetWidth || 180;
      const tH = tooltip.offsetHeight || 25;
      const sTop = rect.top, sBot = window.innerHeight - rect.bottom;
      const sLeft = rect.left, sRight = window.innerWidth - rect.right;
      let top, left;
      if (sTop > tH + pad) {
        top = rect.top + window.scrollY - tH - pad;
        left = rect.left + rect.width / 2 - tW / 2;
      } else if (sBot > tH + pad) {
        top = rect.bottom + window.scrollY + pad;
        left = rect.left + rect.width / 2 - tW / 2;
      } else if (sRight > tW + pad) {
        top = rect.top + window.scrollY + rect.height / 2 - tH / 2;
        left = rect.right + pad;
      } else {
        top = rect.top + window.scrollY + rect.height / 2 - tH / 2;
        left = rect.left - tW - pad;
      }
      if (left < 4) left = 4;
      if (left + tW > window.innerWidth - 4)
        left = window.innerWidth - tW - 4;
      tooltip.style.top = `${top}px`;
      tooltip.style.left = `${left}px`;
    });
    el.addEventListener("mouseleave", () => {
      tooltip.style.opacity = "0";
      tooltip.style.transform = "scale(0.95)";
    });
  });

  /* ==========================================================
     🎛️ Control de filtros manuales
  ========================================================== */
  const filtros = document.getElementById("filtros");
  const btnToggleFiltros = document.getElementById("btnToggleFiltros");
  const btnProducto = document.getElementById("btnProducto");
  const btnCategoria = document.getElementById("btnCategoria");
  const btnFecha = document.getElementById("btnFecha");
  const btnMargen = document.getElementById("btnMargen");

  // Variable global para saber qué tipo de reporte está activo
  window.tipoActual = null;

  // Cerrar filtros al cambiar de tipo de reporte
  [btnProducto, btnCategoria, btnFecha, btnMargen].forEach(btn => {
    btn.addEventListener("click", () => {
      window.tipoActual = btn.id.replace("btn", "").toLowerCase();
      filtros.classList.add("hidden");
    });
  });

  // Mostrar / ocultar filtros solo si aplica
  btnToggleFiltros.addEventListener("click", () => {
    if (window.tipoActual !== "fecha" && window.tipoActual !== "margen") {
      Swal.fire({
        icon: "info",
        title: "Filtros disponibles",
        text: "Solo puedes aplicar filtros en los reportes por Fecha o Margen y Utilidad.",
        confirmButtonColor: "#a21caf",
      });
      return;
    }
    filtros.classList.toggle("hidden");
  });
});
</script>

</body>
</html>
