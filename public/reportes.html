<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartPOS | Reportes</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/reportes.css">

</head>

<body class="min-h-screen bg-gradient-to-br from-purple-800 via-fuchsia-700 to-purple-900 font-sans">

<header class="fixed top-0 left-0 w-full z-50 bg-gradient-to-r from-fuchsia-700 to-purple-800 shadow-lg">

  <div class="max-w-7xl mx-auto px-6 py-3">

    <!-- 🔥 GRID 3 ZONAS -->
    <div class="grid grid-cols-[auto_1fr_auto] items-center gap-4">

      <!-- IZQUIERDA -->
      <div class="flex justify-start">
        <button onclick="window.location.href='/index.html'"
          class="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-lg flex items-center gap-2">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          Volver
        </button>
      </div>

      <!-- CENTRO (BOTONES / TABS) -->
      <div class="flex justify-center items-center gap-2 flex-wrap text-center">

        <button id="btnProducto" class="reporte-btn flex items-center gap-2 bg-blue-600 px-4 py-2 rounded-lg text-white">
          <i data-lucide="package" class="w-4 h-4"></i>
          Venta por Día
        </button>

        <button id="btnCategoria" class="reporte-btn flex items-center gap-2 bg-indigo-600 px-4 py-2 rounded-lg text-white">
          <i data-lucide="layers" class="w-4 h-4"></i>
          Categoría
        </button>

        <button id="btnFecha" class="reporte-btn flex items-center gap-2 bg-teal-600 px-4 py-2 rounded-lg text-white">
          <i data-lucide="calendar" class="w-4 h-4"></i>
          Por Producto
        </button>

        <button id="btnInventario" class="reporte-btn flex items-center gap-2 bg-pink-600 px-4 py-2 rounded-lg text-white">
          <i data-lucide="trending-up" class="w-4 h-4"></i>
          Inventario
        </button>

      </div>

      <!-- DERECHA -->
      <div class="flex justify-end items-center h-full">
        <h1 class="text-white font-bold text-lg whitespace-nowrap text-right">
          Reportes de Ventas
        </h1>
      </div>

    </div>

  </div>
</header>


  <!-- CONTENIDO -->
<main class="pt-28 max-w-7xl mx-auto px-6">
    <!-- 🔥 FILTROS -->
  <section id="filtros" class="bg-white/10 backdrop-blur-md rounded-xl p-4 mb-6 shadow-lg border border-white/20">

  <div class="flex flex-wrap gap-4 items-end">

    <div class="flex flex-col">
      <label class="text-white text-sm">Desde</label>
      <input id="fechaInicio" type="date"
        class="px-3 py-2 rounded-lg bg-white text-black">
    </div>

    <div class="flex flex-col">
      <label class="text-white text-sm">Hasta</label>
      <input id="fechaFin" type="date"
        class="px-3 py-2 rounded-lg bg-white text-black">
    </div>

    <div class="flex flex-col">
      <label class="text-white text-sm">Periodo</label>
      <select id="periodo"
        class="px-3 py-2 rounded-lg bg-white text-black">
        <option value="">-- Selecciona --</option>
        <option value="semana">Semana</option>
        <option value="mes">Mes</option>
        <option value="30dias">30 días</option>
      </select>
    </div>

    <button id="btnAplicarFiltro"
      class="bg-fuchsia-600 hover:bg-fuchsia-700 text-white px-5 py-2 rounded-lg flex items-center gap-2">
      <i data-lucide="filter" class="w-4 h-4"></i>
      Aplicar
    </button>

  </div>

</section>

    <!-- 📊 RESUMEN -->
    <section id="resumenFecha" class="mb-6 hidden"></section>

    <!-- 📋 RESULTADO -->
    <section id="resultado"
   class="bg-white rounded-xl shadow-xl overflow-hidden tabla-categoria"></section>

  </main>

  <!-- SCRIPTS -->
  <script type="module" src="js/localdb.js"></script>
  <script type="module" src="js/proteccion.js"></script>
  <script type="module" src="js/reportes.js"></script>

  <!-- 🔧 INIT -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>

</body>
</html>
