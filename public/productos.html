<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartPOS | Productos</title>

  <!-- 🎨 Librerías base -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>  
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 💅 Estilos SmartPOS -->  
  <link rel="stylesheet" href="css/productos.css">
  <link rel="icon" type="image/png" href="img/favicon-pos.png">
</head>

<body class="min-h-screen flex flex-col font-inter text-gray-900">

  
  <!-- 🧭 Encabezado fijo estilo ventas -->
    <header class="header-productos">
      <div class="header-left">
        <button onclick="window.location.href='/venta.html'" class="btn-volver">
          <i data-lucide="arrow-left"></i>
          Volver a ventas
        </button>

        <div class="titulo">
          <i data-lucide="package" class="icono"></i>
          <h1>PRODUCTOS</h1>
        </div>
      </div>

      <div class="header-right">
        <button id="btnPlantillaCSV" title="Descargar plantilla CSV" class="btn-header sky">
          <i data-lucide="file-down"></i>
        </button>
        <button id="btnPlantilla" class="btn-header fucsia">
          <i data-lucide="download"></i> Exportar Excel
        </button>
        <label for="csvInput" class="btn-header verde cursor-pointer">
          <i data-lucide="upload"></i> Cargar CSV
          <input id="csvInput" type="file" accept=".csv" class="hidden">
        </label>
      </div>
    </header>
  <!-- 📦 Contenido principal -->
  <main class="flex-1 p-6 space-y-6 w-full">

    <!-- 🔍 Filtros -->
    <section class="bg-white/90 backdrop-blur-md rounded-lg border border-fuchsia-100 p-4 grid grid-cols-1 sm:grid-cols-3 gap-3 shadow-sm">
      <input id="q" class="input w-full" placeholder="Buscar por SKU, nombre o código de barras">
      <select id="cat" class="input w-full"></select>
      <div class="flex items-center gap-2">
        <button id="btnBuscar"
          class="bg-gradient-to-r from-fuchsia-600 to-purple-600 text-white font-semibold px-4 py-2 rounded-md flex items-center gap-2 hover:opacity-90 transition">
          <i data-lucide="search" class="w-5 h-5"></i> Buscar
        </button>
        <button id="btnLimpiar"
          class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md flex items-center gap-2 hover:bg-gray-300 transition">
          <i data-lucide="refresh-ccw" class="w-5 h-5"></i> Limpiar
        </button>
      </div>
    </section>

    <!-- 🧾 Tabla de productos -->
    
      <section class="tabla-productos bg-white/90 backdrop-blur-md rounded-lg border border-fuchsia-100 shadow-sm overflow-x-auto p-4">
        <table class="w-full border-separate border-spacing-y-1 text-sm">

     <thead class="bg-gradient-to-r from-fuchsia-600 to-purple-600 text-white">
      <tr>

      <th class="th text-center cursor-pointer" data-field="sku" data-label="SKU">
      SKU
      </th>

      <th class="th text-center cursor-pointer" data-field="codigo_barras" data-label="Código">
      Código
      </th>

      <th class="th text-center">
      Imagen
      </th>

      <th class="th text-left cursor-pointer" data-field="nombre" data-label="Nombre">
      <span class="inline-flex items-center gap-1">
      Nombre
      <i data-lucide="pencil" class="w-3 h-3 opacity-70"></i>
      </span>
      </th>

      <th class="th text-center cursor-pointer" data-field="precio_base" data-label="Precio">
      <span class="inline-flex items-center gap-1">
      Precio
      <i data-lucide="pencil" class="w-3 h-3 opacity-70"></i>
      </span>
      </th>

      <th class="th text-center cursor-pointer" data-field="costo" data-label="Costo">
      <span class="inline-flex items-center gap-1">
      Costo
      <i data-lucide="pencil" class="w-3 h-3 opacity-70"></i>
      </span>
      </th>

      <th class="th text-center">
      <span class="inline-flex items-center gap-1">
      Margen %
      <i data-lucide="pencil" class="w-3 h-3 opacity-70"></i>
      </span>
      </th>

      <th class="th text-center">
      Ganancia
      </th>

      <th class="th text-center cursor-pointer" data-field="existencias_total" data-label="Exist">
      Exist.
      </th>

      <th class="th text-center cursor-pointer" data-field="stock_minimo" data-label="Mínimo">
      <span class="inline-flex items-center gap-1">
      Mínimo
      <i data-lucide="pencil" class="w-3 h-3 opacity-70"></i>
      </span>
      </th>

      <th class="th text-center cursor-pointer" data-field="caducidad_proxima" data-label="Caducidad">
      Caducidad
      </th>

      <th class="th text-center">
      Acciones
      </th>

      </tr>
      </thead>

        <tbody id="tbody"></tbody>

        </table>
        </section>
      <!-- 📄 Paginación -->
      <div class="paginacion flex items-center justify-between p-3 border-t border-gray-300 mt-3">
        <div class="text-sm"><span id="lblRango">0–0</span> resultados</div>
        <div class="flex items-center gap-2">
          <button id="prev" class="bg-gray-200 px-2 py-1 rounded hover:bg-gray-300 transition"><i data-lucide="chevron-left"></i></button>
          <span id="page" class="text-sm font-semibold"></span>
          <button id="next" class="bg-gray-200 px-2 py-1 rounded hover:bg-gray-300 transition"><i data-lucide="chevron-right"></i></button>
        </div>
      </div>    
  </main>

  <!-- 🧾 Modal Edición -->
  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/30"></div>
    <div class="relative mx-auto mt-10 max-w-lg bg-white rounded-lg border border-fuchsia-200 shadow-lg p-6">
      <h2 class="text-lg font-bold text-gradient mb-3 border-b pb-2 flex items-center gap-2">
        <i data-lucide="pencil"></i> Editar producto
      </h2>

      <form id="formEdit" class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
        <input type="hidden" id="e_id">

        <div class="flex flex-col"><label>SKU</label><input id="e_sku" class="input" disabled></div>
        <div class="flex flex-col"><label>Código</label><input id="e_barcode" class="input"></div>
        <div class="flex flex-col md:col-span-2"><label>Nombre</label><input id="e_nombre" class="input" required></div>
        <div class="flex flex-col md:col-span-2"><label>Descripción</label><textarea id="e_desc" class="input" rows="2"></textarea></div>
        <div class="flex flex-col"><label>Categoría</label><input id="e_categoria" class="input"></div>
        <div class="flex flex-col"><label>Precio</label><input id="e_precio" type="number" step="0.01" class="input"></div>
        <div class="flex flex-col"><label>Costo</label><input id="e_costo" type="number" step="0.01" class="input"></div>
        <div class="flex flex-col"><label>Stock mínimo</label><input id="e_minimo" type="number" step="0.01" class="input"></div>
        <div class="flex flex-col">
          <label>Existencias actuales</label>
          <input 
            id="e_existencias" 
            type="number" 
            min="0"
            step="0.001"
            class="input"
          />
          <span class="text-xs text-gray-400">
            Ajuste manual (solo administrador)
          </span>
        </div>


        <!-- 📷 Imagen -->
        <div class="md:col-span-2 flex flex-col">
          <label class="font-semibold mb-1">Imagen del producto</label>
          <div class="flex items-center gap-4">
            <div id="imgContainer" class="w-24 h-24 rounded-lg border border-gray-300 bg-gray-100 flex items-center justify-center overflow-hidden relative">
              <img id="e_preview" src="" alt="Vista previa" class="object-cover w-full h-full hidden" />
              <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400">
                <i data-lucide="camera" class="w-6 h-6 mb-1"></i>
                <span class="text-xs">Sin imagen</span>
              </div>
            </div>

            <div class="flex flex-col gap-2">
              <label for="e_imagen" class="bg-purple-600 text-white text-xs px-3 py-1 rounded cursor-pointer flex items-center gap-1 hover:opacity-90 transition">
                <i data-lucide="upload" class="w-4 h-4"></i> Subir archivo
              </label>
              <input
                id="e_imagen"
                type="file"
                accept="image/*"
                class="absolute opacity-0 w-0 h-0 pointer-events-none"
              />

             <button
                type="button"
                id="btnCamara"
                class="bg-fuchsia-600 text-white text-xs px-3 py-1 rounded flex items-center gap-1 hover:opacity-90 transition"
              >

                <i data-lucide="camera" class="w-4 h-4"></i> Tomar foto
              </button>
              <button type="button" id="btnQuitarImg" class="bg-red-600 text-white text-xs px-3 py-1 rounded flex items-center gap-1 hover:opacity-90 transition">
                <i data-lucide="trash-2" class="w-4 h-4"></i> Quitar
              </button>
            </div>
          </div>
        </div>

        <div class="flex flex-col">
          <label>Activo</label>
          <select id="e_activo" class="input">
            <option value="true">Sí</option>
            <option value="false">No</option>
          </select>
        </div>

        <!-- ⭐ BOTONES SUBIDOS Y MEJOR ALINEADOS -->
        <div class="md:col-span-2 flex justify-end gap-3 mt-2 pb-3 
                    sticky bottom-0 bg-white/95 backdrop-blur-md pt-3 border-t">

          <button type="button" id="btnCancel"
            class="px-4 py-2 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300 transition">
            Cancelar
          </button>

          <button type="submit"
            class="px-4 py-2 rounded-md bg-gradient-to-r from-fuchsia-600 to-purple-600 
                  text-white font-semibold shadow-sm hover:opacity-90 transition">
            Guardar
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- ⚙️ Scripts -->
  <script type="module" src="/js/localdb.js"></script>  
  <script type="module" src="js/admin_productos.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => lucide.createIcons());
  </script>
</body>
</html>
